name: Docker Build, Push & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-deploy
  cancel-in-progress: false

env:
  IMAGE: mohamedbasem2/loki-freelance-assistant

jobs:
  test:
    name: Run tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest tests/ -q

      - name: Smoke-test unguarded entrypoint stays config-driven
        env:
          NOTIFICATION_GUARD_ENABLED: "false"
          GEMINI_API_KEYS: "ci-placeholder"
          GROQ_API_KEY: "ci-placeholder"
        run: >-
          python -c
          "import run; import app.notification_guard.config as gc;
          import sys; sys.exit(0 if gc.NOTIFICATION_GUARD_ENABLED is False else 1)"

      - name: Smoke-test guarded entrypoint forces the guard on
        env:
          NOTIFICATION_GUARD_ENABLED: "false"
          GEMINI_API_KEYS: "ci-placeholder"
          GROQ_API_KEY: "ci-placeholder"
          GROQ_NOTIFICATION_GUARD_API_KEY: "ci-placeholder"
          GROQ_NOTIFICATION_GUARD_MODELS: "llama-3.3-70b-versatile"
        run: >-
          python -c
          "import run_guarded; import app.notification_guard.config as gc;
          import sys; sys.exit(0 if gc.NOTIFICATION_GUARD_ENABLED is True else 1)"

      - name: Smoke-test guarded entrypoint fails loudly without guard config
        env:
          NOTIFICATION_GUARD_ENABLED: "false"
          GEMINI_API_KEYS: "ci-placeholder"
          GROQ_API_KEY: "ci-placeholder"
        run: |
          if python -c "import run_guarded" 2>guarded_import.err; then
            echo "expected 'import run_guarded' to fail without GROQ_NOTIFICATION_GUARD_API_KEY" >&2
            exit 1
          fi
          grep -q "GROQ_NOTIFICATION_GUARD_API_KEY" guarded_import.err

      - name: Smoke-test real runtime composition
        env:
          NOTIFICATION_GUARD_ENABLED: "false"
          GEMINI_API_KEYS: "ci-placeholder"
          GROQ_API_KEY: "ci-placeholder"
          BOT_TOKEN: "123456789:ci-placeholder"
          FREEHUB_USER_ID: "ci-placeholder"
          API_ID: "10000000"
          API_HASH: "test-api-hash-not-a-real-secret"
          PHONE_NUMBER: "+10000000000"
        run: python scripts/ci_smoke_test.py

  build-and-push:
    name: Build and push image to Docker Hub
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to production via Tailscale SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check required secrets and variables
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::SSH_PRIVATE_KEY secret is not set. Add it in repo Settings > Secrets and variables > Actions."; exit 1; }
          test -n "$DEPLOY_HOST" || { echo "::error::DEPLOY_HOST variable is not set. Add it in repo Settings > Secrets and variables > Actions > Variables."; exit 1; }
          test -n "$DEPLOY_USER" || { echo "::error::DEPLOY_USER variable is not set."; exit 1; }
          test -n "$DEPLOY_DIR" || { echo "::error::DEPLOY_DIR variable is not set."; exit 1; }

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Inspect runner node identity
        run: |
          tailscale status
          echo "---"
          tailscale status --json | grep -E '"HostName"|"Tags"|"MachineName"|"ID"'

      - name: Pull image and recreate service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          port: ${{ vars.DEPLOY_PORT || '22' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: "5m"
          script: |
            set -e
            cd ${{ vars.DEPLOY_DIR }}

            # Runtime data on the host (loki_freelance_bot.db, sessions/,
            # database/, .env) is never touched or overwritten here; it is
            # only bind-mounted into the container by docker-compose.yml.
            docker compose up -d --pull always

            # Fail the deployment if the container starts but does not reach
            # a healthy DB/state-backed runtime state. This catches crash loops
            # and broken bind mounts that `docker compose up -d` alone hides.
            for i in $(seq 1 12); do
              STATUS="$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q loki)" 2>/dev/null || true)"
              if [ "$STATUS" = "healthy" ]; then
                break
              fi
              if [ "$STATUS" = "unhealthy" ]; then
                docker compose logs --tail 100 loki || true
                exit 1
              fi
              sleep 5
            done
            STATUS="$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q loki)" 2>/dev/null || true)"
            test "$STATUS" = "healthy" || { docker compose logs --tail 100 loki || true; exit 1; }

            # Old :latest and :<sha> images pile up on the host after every
            # deploy (nothing purges them), which is why Portainer shows
            # dozens of images / 12 GB even after pruning. Drop all dangling
            # images and any locally-orphaned tag of this repo older than the
            # image currently in use by the running container.
            LOCAL_TAG="mohamedbasem2/loki-freelance-assistant:latest"
            IN_USE_TAG="$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q loki)" 2>/dev/null || echo '')"
            docker images "mohamedbasem2/loki-freelance-assistant*" --format '{{.Repository}}:{{.Tag}} {{.ID}}' | while read -r img id; do
              tag="${img% *}"
              if [ "$tag" != "$LOCAL_TAG" ] && [ "$tag" != "$IN_USE_TAG" ]; then
                docker rmi "$img" >/dev/null 2>&1 || true
              fi
            done
            docker image prune -f
