name: Docker Build, Push & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-deploy
  cancel-in-progress: false

env:
  IMAGE: mohamedbasem2/loki-freelance-assistant

jobs:
  test:
    name: Run tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run test suite
        run: pytest tests/ -q

  build-and-push:
    name: Build and push image to Docker Hub
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to production via Tailscale SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check required secrets and variables
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::SSH_PRIVATE_KEY secret is not set. Add it in repo Settings > Secrets and variables > Actions."; exit 1; }
          test -n "$DEPLOY_HOST" || { echo "::error::DEPLOY_HOST variable is not set. Add it in repo Settings > Secrets and variables > Actions > Variables."; exit 1; }
          test -n "$DEPLOY_USER" || { echo "::error::DEPLOY_USER variable is not set."; exit 1; }
          test -n "$DEPLOY_DIR" || { echo "::error::DEPLOY_DIR variable is not set."; exit 1; }

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Inspect runner node identity
        run: |
          tailscale status
          echo "---"
          tailscale status --json | grep -E '"HostName"|"Tags"|"MachineName"|"ID"'

      - name: Pull image and recreate service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          port: ${{ vars.DEPLOY_PORT || '22' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: "5m"
          script: |
            set -e
            cd ${{ vars.DEPLOY_DIR }}

            # Always fetch the exact docker-compose.yml for this commit
            # from the repo before bringing the service up, so the
            # server never runs a stale copy. Runtime data on the host
            # (.env, sessions/, database/, loki_freelance_bot.db) is
            # bind-mounted by the compose file and left untouched.
            curl -fsSL \
              "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docker-compose.yml" \
              -o docker-compose.yml

            docker compose up -d --pull always
