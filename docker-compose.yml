services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loki}
      POSTGRES_DB: ${POSTGRES_DB:-loki}
    volumes:
      - loki_pg_data:/var/lib/postgresql/data
    # Published on the host too so `scripts/migrate_postgres.py` and a
    # SQL client can reach it at localhost:5432 without going through
    # the loki service.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loki} -d ${POSTGRES_DB:-loki}"]
      interval: 5s
      timeout: 5s
      retries: 10

  loki:
    image: mohamedbasem2/loki-freelance-assistant:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Redis lives outside this compose file (REDIS_URL comes from
      # .env as-is), but Postgres is this compose file's own service --
      # override whatever host .env's DATABASE_URL points at so this
      # container always talks to the `postgres` service on the
      # compose-internal network, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-loki}:${POSTGRES_PASSWORD:-loki}@postgres:5432/${POSTGRES_DB:-loki}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Reuse the locally-created Telegram session and dedup/read-state
      # instead of creating fresh ones inside the container
      # (sessions/telegram.session -> /app/sessions,
      #  database/state.json -> /app/database). The audit log itself is
      # in the `postgres` service now, not a bind-mounted file.
      - ./sessions:/app/sessions
      - ./database:/app/database
    # Guarded entry point (adds the Notification Guard on top of the
    # standard pipeline). To deploy the standard entry point instead
    # (no Notification Guard), replace this with:
    #   command: python run.py
    command: python run_guarded.py
    # Postgres itself now supports genuine concurrent writers (see
    # app/adapters/repositories/postgres.py), so the old SQLite
    # single-writer-process invariant no longer applies to job/audit
    # persistence. state.json (dedup/read-state) and the Telegram
    # session file are still plain files on a bind mount, though --
    # do not scale this service to multiple replicas sharing the same
    # ./sessions and ./database volumes.
    healthcheck:
      test: ["CMD", "python", "-m", "app.infra.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Covers both the Postgres/Redis connectivity check's own bounded
      # timeout and the worker heartbeat (app.infra.heartbeat writes its
      # first beat immediately on startup, well inside this window; see
      # app/infra/healthcheck.py's worker/runtime health check).
      start_period: 30s

volumes:
  loki_pg_data:
